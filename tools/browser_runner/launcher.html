  launcher.html — PS5 browser probe launcher.
  
  Serves as the index page (/) and lets you select which probe to run
  without typing URLs. Each probe button navigates to the corresponding

  Usage: Open https://<SERVER_IP>/ in the PS5 browser, then click the
  probe you want to run.
-->

<script>
function navigate(url) {
  var status = document.createElement('div');
  status.className = 'status';
  status.textContent = 'Loading ' + url + '...';
  document.body.appendChild(status);
  setTimeout(function() { window.location.href = url + '?v=' + Date.now(); }, 500);
}
function resetAndNav(url) {
  var status = document.createElement('div');
  status.className = 'status';
  status.textContent = 'Resetting state + loading ' + url + '...';
  document.body.appendChild(status);
  var x = new XMLHttpRequest();
  x.open('POST', '/p807state?reset', false);
  x.send(null);
  setTimeout(function() { window.location.href = url + '?v=' + Date.now(); }, 500);
}
function resetP818AndNav() {
  var status = document.createElement('div');
  status.className = 'status';
  status.textContent = 'Resetting p818 slice counter...';
  document.body.appendChild(status);
  var x = new XMLHttpRequest();
  x.open('GET', '/p818reset', false);
  x.send(null);
  setTimeout(function() { window.location.href = '/p818v16.html?v=' + Date.now(); }, 500);
}
</script>
